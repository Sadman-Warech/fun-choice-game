<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fun Choice Game</title>
<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
        background-color: #f4f7f6;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
    }

    .game {
        width: 100%;
        max-width: 520px;
    }

    h2 {
        color: #2c3e50;
        font-size: 28px;
        margin-bottom: 30px;
    }

    .btn-container {
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
    }

    button {
        padding: 15px 30px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        transition: transform 0.2s ease, background-color 0.2s ease;
        min-width: 190px;
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
    }

    #mirpurBtn {
        background-color: #e74c3c;
        color: white;
    }

    #bashundharaBtn {
        background-color: #2ecc71;
        color: white;
    }

    button:active {
        transform: scale(0.96);
    }

    .message {
        margin-top: 25px;
        min-height: 30px;
        color: #2c3e50;
        font-size: 18px;
        font-weight: 600;
    }
</style>
</head>

<body>
<div class="game">
    <h2>Where do you want to go?</h2>

    <div class="btn-container">
        <button id="mirpurBtn" type="button">
            Option A: Mirpur
        </button>

        <button id="bashundharaBtn" type="button">
            Option B: Bashundhara
        </button>
    </div>

    <div id="message" class="message" aria-live="polite"></div>
</div>

<script>
    const mirpurBtn = document.getElementById("mirpurBtn");
    const bashundharaBtn = document.getElementById("bashundharaBtn");
    const message = document.getElementById("message");

    // Touch-friendly behavior:
    // Tapping Mirpur changes it to Bashundhara instead of relying on mouseover.
    function changeToBashundhara() {
        mirpurBtn.innerText = "Option B: Bashundhara";
        mirpurBtn.style.backgroundColor = "#2ecc71";
        mirpurBtn.onclick = selectBashundhara;
    }

    function selectBashundhara() {
        message.innerText = "Great choice! You are going to Bashundhara! 🚗💨";
    }

    // Use pointer events so the page works with iPhone touch,
    // Android touch and desktop mouse/pen input.
    mirpurBtn.addEventListener("pointerup", function () {
        if (mirpurBtn.innerText.includes("Mirpur")) {
            changeToBashundhara();
        } else {
            selectBashundhara();
        }
    });

    bashundharaBtn.addEventListener("pointerup", selectBashundhara);
</script>
</body>
</html>
